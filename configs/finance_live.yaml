# finance_live: verify word2vec claims against REAL live market + news data
seed: 42
corpus: live
dim: 50
window: 5
min_count: 2
sample_t: 1.0e-4
negative: 5
ns_exponent: 0.75
hs: 0
sg: 1
epochs: 20
alpha: 0.05
min_alpha: 0.001
workers: 1
tickers: [AAPL, MSFT, NVDA, TSLA, SPY, 600519.SS]
news_queries: ["stock market", "Federal Reserve rates", "AI chips earnings", "oil price"]
max_headlines_per_query: 30
yahoo_range: 1mo
analogy_file: data/questions-words.sample.txt
finance_analogy_file: data/finance-analogy.txt
